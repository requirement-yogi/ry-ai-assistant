name: Pull Request - Claude Code Review

# Use a concurrency group to avoid reviewing the same branch multiple times in parallel
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

on:
  # When a comment is created on an issue or pull request
  issue_comment:
    types: ["created"]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'The pull request number'
        required: true

permissions:
  contents: read # To clone the repository
  pull-requests: write # To comment on the pull requests
  issues: write # To comment on the issues
  id-token: write # To use a GitHub OIDC token (apparently required by the Claude Code Action)

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review') &&
        github.event.comment.user.type != 'Bot'
      )

    steps:
      - name: Mark the comment as read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='eyes'

      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Perform the review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Run /code-review, but instead of comparing against HEAD~1, compare the full PR diff against the base branch:
            gh pr diff ${{ github.event.issue.number }}

            Always post the review as a single comment on the PR. Even if you have nothing to report write a comment to
            let the user know that the PR has been reviewed.

            Use this to post the review:
            gh pr comment ${{ github.event.issue.number }} --body "..."
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh pr comment:*)",
                  "Bash(gh pr diff:*)",
                  "mcp__github_inline_comment__create_inline_comment"
                ]
              }
            }
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr comment:*)"

      - name: Mark the comment as done
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content="${{ job.status == 'success' && 'rocket' || 'confused' }}"
